<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Service Monitoring Dashboard — Production-style Operations Monitoring Dashboard providing service health, metrics, incident management and deterministic simulation.">
  <meta name="theme-color" content="#F7F9FC">
  <title>Service Monitoring Dashboard — Operations Monitoring Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css?v=28.0">
</head>
<body>
  <!-- Skip link for accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Toast container -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="false" class="toast-container"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button id="modal-close-btn" class="btn-icon" aria-label="Close dialog">
          <span aria-hidden="true">✕</span>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- App root canvas -->
  <div id="app" class="app-canvas">
    <div class="bento-sheet">

      <!-- ── Top navigation bar ── -->
      <header class="topbar" id="topbar" role="banner">
        <div class="topbar-left">
          <button id="menu-toggle-btn" class="btn-icon mobile-only" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-drawer">
            <span aria-hidden="true" id="menu-icon-slot">☰</span>
          </button>
          <a href="#/dashboard" class="brand-link" aria-label="Service Monitoring Dashboard Home">
            <span class="brand-logo-mark" id="brand-logo-mark" aria-hidden="true"></span>
            <span class="brand-name">Service Monitoring Dashboard</span>
          </a>
        </div>

        <nav class="pill-nav-group desktop-only" id="pill-nav-group" aria-label="Main navigation">
          <a href="#/dashboard" class="pill-nav-item active" id="nav-dashboard" data-view="dashboard" aria-current="page">Dashboard</a>
          <a href="#/services" class="pill-nav-item" id="nav-services" data-view="services">Services</a>
          <a href="#/incidents" class="pill-nav-item" id="nav-incidents" data-view="incidents">
            <span>Incidents</span>
            <span id="nav-incident-badge" class="pill-badge hidden" aria-label="open incidents">0</span>
          </a>
          <a href="#/audit" class="pill-nav-item hidden" id="nav-audit" data-view="audit">Audit Log</a>
          <a href="#/simulator" class="pill-nav-item hidden" id="nav-simulator" data-view="simulator">Simulator</a>
        </nav>

        <div class="topbar-right">
          <button id="topbar-search-btn" class="btn-icon" aria-label="Search services" title="Search services">
            <span id="search-icon-slot" aria-hidden="true"></span>
          </button>
          <a href="#/incidents" id="topbar-bell-btn" class="btn-icon topbar-bell" aria-label="View incidents" title="View incidents">
            <span id="bell-icon-slot" aria-hidden="true"></span>
            <span id="incident-badge" class="topbar-badge hidden" aria-label="open incidents"></span>
          </a>
          <button id="theme-toggle-btn" class="btn-icon" aria-label="Toggle theme" title="Toggle dark/light mode">
            <span id="theme-icon-slot" aria-hidden="true"></span>
          </button>
          <div class="user-avatar-wrap" id="user-chip" aria-label="Signed-in user">
            <span class="user-avatar" id="user-avatar" aria-hidden="true">?</span>
            <span class="user-role-tag" id="user-role-badge">viewer</span>
          </div>
          <button id="logout-btn" class="btn-icon" aria-label="Sign out" title="Sign out">
            <span id="logout-icon-slot" aria-hidden="true"></span>
          </button>
        </div>
      </header>

      <!-- ── Mobile navigation drawer ── -->
      <nav id="mobile-drawer" class="mobile-drawer hidden" aria-label="Mobile navigation">
        <ul class="mobile-nav-list" role="list">
          <li><a href="#/dashboard" class="mobile-nav-link" id="mob-nav-dashboard" data-view="dashboard">Dashboard</a></li>
          <li><a href="#/services" class="mobile-nav-link" id="mob-nav-services" data-view="services">Services</a></li>
          <li>
            <a href="#/incidents" class="mobile-nav-link" id="mob-nav-incidents" data-view="incidents">
              <span>Incidents</span>
              <span id="mob-incident-badge" class="badge badge-danger hidden">0</span>
            </a>
          </li>
          <li id="mob-nav-admin-section" class="hidden">
            <a href="#/audit" class="mobile-nav-link" id="mob-nav-audit" data-view="audit">Audit Log</a>
          </li>
          <li id="mob-nav-sim-section" class="hidden">
            <a href="#/simulator" class="mobile-nav-link" id="mob-nav-simulator" data-view="simulator">Simulator</a>
          </li>
        </ul>
      </nav>

      <!-- ── Main content area ── -->
      <main id="main-content" class="main-content" tabindex="-1">
        <div id="view-container" class="view-container"></div>
      </main>

      <!-- ── Minimal Application Footer ── -->
      <footer class="app-footer" role="contentinfo">
        <div class="footer-content">
          <div class="footer-left">
            <span>Service Monitoring Dashboard</span>
            <span class="footer-dot">•</span>
            <span>v0.1.0</span>
          </div>
          <div class="footer-right">
            <span>Built by <strong>Hammad</strong> &amp; <strong>Maaz Ali</strong></span>
            <span class="footer-dot">•</span>
            <a href="mailto:aiwithhammad2026@gmail.com" class="footer-link">aiwithhammad2026@gmail.com</a>
            <span class="footer-dot">•</span>
            <a href="mailto:maazzalii11@gmail.com" class="footer-link">maazzalii11@gmail.com</a>
          </div>
        </div>
      </footer>


    </div><!-- /.bento-sheet -->
  </div><!-- /#app -->

  <!-- Vendored Chart.js -->
  <script src="/vendor/chart.umd.js"></script>
  <!-- ES module entry -->
  <script type="module" src="/js/app.js?v=26.1"></script>
</body>
</html>
