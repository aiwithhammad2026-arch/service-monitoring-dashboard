<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PulseOps — Production-style Operations Monitoring Dashboard providing service health, metrics, incident management and deterministic simulation.">
  <meta name="theme-color" content="#0b0f19">
  <title>PulseOps — Operations Monitoring Dashboard</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Skip link for accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Toast container -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="false" class="toast-container"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button id="modal-close-btn" class="btn btn-icon" aria-label="Close dialog">
          <span aria-hidden="true">✕</span>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-footer" class="modal-footer"></div>
    </div>
  </div>

  <!-- App root -->
  <div id="app" class="app-root">

    <!-- ── Sidebar (desktop) ── -->
    <nav id="sidebar" class="sidebar" aria-label="Main navigation">
      <div class="sidebar-brand">
        <span class="brand-icon" aria-hidden="true">⚡</span>
        <span class="brand-name">PulseOps</span>
      </div>

      <ul class="nav-list" role="list">
        <li class="nav-item">
          <a href="#/dashboard" class="nav-link" id="nav-dashboard" data-view="dashboard">
            <span class="nav-icon" aria-hidden="true">◈</span>
            <span class="nav-label">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#/services" class="nav-link" id="nav-services" data-view="services">
            <span class="nav-icon" aria-hidden="true">◎</span>
            <span class="nav-label">Services</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="#/incidents" class="nav-link" id="nav-incidents" data-view="incidents">
            <span class="nav-icon" aria-hidden="true">⚠</span>
            <span class="nav-label">Incidents</span>
            <span id="incident-badge" class="badge badge-danger hidden" aria-label="open incidents"></span>
          </a>
        </li>
        <li class="nav-item nav-item--admin hidden" id="nav-admin-section">
          <a href="#/audit" class="nav-link" id="nav-audit" data-view="audit">
            <span class="nav-icon" aria-hidden="true">📋</span>
            <span class="nav-label">Audit Log</span>
          </a>
        </li>
        <li class="nav-item nav-item--admin hidden" id="nav-simulator-section">
          <a href="#/simulator" class="nav-link" id="nav-simulator" data-view="simulator">
            <span class="nav-icon" aria-hidden="true">⚙</span>
            <span class="nav-label">Simulator</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="user-chip" id="user-chip" aria-label="Signed-in user">
          <span class="user-avatar" aria-hidden="true" id="user-avatar">?</span>
          <div class="user-info">
            <span class="user-name" id="user-name">—</span>
            <span class="user-role badge" id="user-role-badge">—</span>
          </div>
        </div>
        <div class="sidebar-actions">
          <button id="theme-toggle-btn" class="btn btn-icon" aria-label="Toggle theme" title="Toggle dark/light mode">
            <span id="theme-icon" aria-hidden="true">☀</span>
          </button>
          <button id="logout-btn" class="btn btn-icon" aria-label="Sign out" title="Sign out">
            <span aria-hidden="true">⏻</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- ── Mobile top bar ── -->
    <header class="topbar" id="topbar" role="banner">
      <button id="menu-toggle-btn" class="btn btn-icon" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <span aria-hidden="true">☰</span>
      </button>
      <span class="topbar-brand">
        <span aria-hidden="true">⚡</span> PulseOps
      </span>
      <div class="topbar-actions">
        <span id="topbar-incident-badge" class="badge badge-danger hidden" aria-label="open incidents"></span>
        <button id="topbar-theme-btn" class="btn btn-icon" aria-label="Toggle theme">
          <span id="topbar-theme-icon" aria-hidden="true">☀</span>
        </button>
      </div>
    </header>

    <!-- ── Main content area ── -->
    <main id="main-content" class="main-content" tabindex="-1">
      <!-- Router injects views here -->
      <div id="view-container" class="view-container"></div>
    </main>

  </div><!-- /#app -->

  <!-- Vendored Chart.js -->
  <script src="/vendor/chart.umd.js"></script>
  <!-- ES module entry -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
