[project]
name = "service-monitoring-dashboard"
version = "0.1.0"
description = "Production-style operations monitoring dashboard built with FastAPI, SQLite and vanilla JS, providing service health, deterministic traffic simulation, incident management and audit logging."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.142.2",
    "itsdangerous>=2.2.0",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3.4",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
]
